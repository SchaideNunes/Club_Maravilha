# ==============================================================================
# CLUB MARAVILHA - DOCKER COMPOSE ORCHESTRATION (PRODUÇÃO / VPS)
# ==============================================================================
# Execução na VPS:
# docker compose -f docker-compose.prod.yml up -d --build
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # [1] BANCO DE DADOS RELACIONAL (PostgreSQL 16)
  # Porta 5432 fechada externamente (acesso exclusivo pela rede interna)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: club_maravilha_db_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-club_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-club_secret_password_change_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-club_maravilha}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-club_admin} -d ${POSTGRES_DB:-club_maravilha}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: always
    networks:
      - club_network

  # ----------------------------------------------------------------------------
  # [2] BACKEND API (FastAPI + 2 Workers Uvicorn + Migrações Automáticas)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: club_maravilha_backend_prod
    # Executa migrações do Alembic antes de subir os workers de produção
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-club_admin}:${POSTGRES_PASSWORD:-club_secret_password_change_in_prod}@db:5432/${POSTGRES_DB:-club_maravilha}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-club_admin}:${POSTGRES_PASSWORD:-club_secret_password_change_in_prod}@db:5432/${POSTGRES_DB:-club_maravilha}
      WHATSAPP_API_URL: http://whatsapp:8080
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - club_network

  # ----------------------------------------------------------------------------
  # [3] FRONTEND SPA (React Compilado + Servidor Nginx Otimizado)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: club_maravilha_frontend_prod
    restart: always
    networks:
      - club_network

  # ----------------------------------------------------------------------------
  # [4] EVOLUTION API (WhatsApp Gateway - Baileys)
  # ----------------------------------------------------------------------------
  whatsapp:
    image: evoapicloud/evolution-api:latest
    container_name: club_maravilha_whatsapp_prod
    environment:
      - SERVER_URL=http://localhost:8080
      - SERVER_PORT=8080
      - AUTHENTICATION_API_KEY=${WHATSAPP_API_KEY:-club_maravilha_secret_key_123}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER:-club_admin}:${POSTGRES_PASSWORD:-club_secret_password_change_in_prod}@db:5432/${POSTGRES_DB:-club_maravilha}?schema=evolution
      - DATABASE_CONNECTION_CLIENT_NAME=club_maravilha_evolution_prod
      - CACHE_REDIS_ENABLED=false
      - LOG_LEVEL=ERROR,WARN
      - DEL_INSTANCE=false
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - club_network

  # ----------------------------------------------------------------------------
  # [5] PROXY REVERSO NGINX (Ponto de Entrada Único - Portas 80 e 443)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: club_maravilha_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/letsencrypt
    depends_on:
      - frontend
      - backend
      - whatsapp
    restart: always
    networks:
      - club_network

# ------------------------------------------------------------------------------
# VOLUMES PERSISTENTES E REDES
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  certbot_certs:
    driver: local
  evolution_instances:
    driver: local

networks:
  club_network:
    driver: bridge
