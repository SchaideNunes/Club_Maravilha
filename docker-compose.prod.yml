# ==============================================================================
# CLUB MARAVILHA - DOCKER COMPOSE ORCHESTRATION (PRODUÇÃO / VPS)
# ==============================================================================
# Execução na VPS:
# docker compose -f docker-compose.prod.yml up -d --build
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # [1] BANCO DE DADOS RELACIONAL (PostgreSQL 16)
  # Porta 5432 fechada externamente (acesso exclusivo pela rede interna)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: club_maravilha_db_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-club_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-club_maravilha}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-club_admin} -d ${POSTGRES_DB:-club_maravilha}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: always
    networks:
      - club_network

  # ----------------------------------------------------------------------------
  # [2] BACKEND API (FastAPI + 1 Worker Uvicorn + Migrações Automáticas)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: club_maravilha_backend_prod
    # Antes de subir a API, scripts.migrate prepara o banco: banco vazio -> create_all + alembic stamp head;
    # banco existente -> alembic upgrade head. Falhou? A API não sobe (&&).
    # Um único worker: o APScheduler (régua de cobrança) e a fila anti-ban de WhatsApp rodam
    # dentro do processo da API, e vários workers duplicariam disparos. Só aumente --workers se
    # SCHEDULER_ENABLED ficar ligado em um único processo.
    command: sh -c "python -m scripts.migrate && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-club_admin}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db:5432/${POSTGRES_DB:-club_maravilha}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-club_admin}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db:5432/${POSTGRES_DB:-club_maravilha}
      # Motor WhatsApp (Baileys) acessado pela rede interna do compose, com a mesma chave do engine
      WHATSAPP_ENGINE_URL: http://whatsapp-engine:3001
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:?defina WHATSAPP_API_KEY no .env}
      WHATSAPP_PROVIDER: BAILEYS
    depends_on:
      db:
        condition: service_healthy
      whatsapp-engine:
        condition: service_started
    restart: always
    networks:
      - club_network

  # ----------------------------------------------------------------------------
  # [3] FRONTEND SPA (React Compilado + Servidor Nginx Otimizado)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: club_maravilha_frontend_prod
    restart: always
    networks:
      - club_network

  # ----------------------------------------------------------------------------
  # [4] MOTOR WHATSAPP (Baileys - microsserviço Node/TypeScript próprio)
  # Sem porta publicada: acessível apenas pelo backend na rede interna.
  # A sessão autenticada do número fica no volume nomeado whatsapp_auth (/app/auth):
  # recriar o container não exige novo pareamento por QR Code.
  # ----------------------------------------------------------------------------
  whatsapp-engine:
    build:
      context: ./whatsapp-engine
      dockerfile: Dockerfile
    container_name: club_maravilha_whatsapp_engine_prod
    environment:
      PORT: "3001"
      API_KEY: ${WHATSAPP_API_KEY:?defina WHATSAPP_API_KEY no .env}
      AUTH_DIR: /app/auth
    volumes:
      - whatsapp_auth:/app/auth
    restart: always
    networks:
      - club_network

  # ----------------------------------------------------------------------------
  # [5] PROXY REVERSO NGINX (Ponto de Entrada Único - Portas 80 e 443)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: club_maravilha_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/letsencrypt
    depends_on:
      - frontend
      - backend
    restart: always
    networks:
      - club_network

# ------------------------------------------------------------------------------
# VOLUMES PERSISTENTES E REDES
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  certbot_certs:
    driver: local
  whatsapp_auth:
    driver: local

networks:
  club_network:
    driver: bridge
