# ==============================================================================
# CLUB MARAVILHA - NGINX REVERSE PROXY CONFIGURATION (PRODUÇÃO)
# ==============================================================================

server {
    listen 80;
    server_name _;
    client_max_body_size 50M; # Permite upload de planilhas de sócios e fotos de biometria

    # --------------------------------------------------------------------------
    # Frontend SPA (servido pelo container frontend Nginx compilado)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # Backend API REST & Webhooks Instantâneos Pix (< 2s)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # Documentação Interativa OpenAPI / Swagger
    # --------------------------------------------------------------------------
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
