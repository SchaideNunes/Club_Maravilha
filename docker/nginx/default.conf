# ==============================================================================
# CLUB MARAVILHA - NGINX REVERSE PROXY CONFIGURATION (PRODUÇÃO)
# ==============================================================================

server {
    listen 80;
    server_name _;
    client_max_body_size 50M; # Permite upload de planilhas de sócios e fotos de biometria

    # --------------------------------------------------------------------------
    # Frontend SPA (servido pelo container frontend Nginx compilado)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # Catraca Facial & Controle de Acesso Físico (Restrito à LAN do Clube)
    # --------------------------------------------------------------------------
    location /api/v1/catraca/ {
        # Restringe o acesso às faixas de IP da rede local / controladoras da catraca
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://backend:8000/api/v1/catraca/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # Backend API REST & Webhooks Instantâneos Pix (< 2s)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # Documentação Interativa OpenAPI / Swagger
    # --------------------------------------------------------------------------
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
