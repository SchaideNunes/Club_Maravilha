# Configuração do Nginx interno para o container do Frontend SPA
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compressão Gzip para carregamento ultrarrápido
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Suporte ao React Router (roteamento no lado do cliente)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de longa duração para assets estáticos com hash no nome (Vite)
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Desabilita cache do index.html para que atualizações entrem em vigor imediatamente
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }
}
